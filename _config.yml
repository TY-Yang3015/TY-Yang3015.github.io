title: "Tianyue Yang"
description: "Tianyue Yang — AI, physics, chemistry, and scientific machine learning."
url: "https://ty-yang3015.github.io"
baseurl: ""
timezone: Europe/London

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax

permalink: /blog/:year/:month/:day/:title/
excerpt_separator: "<!--more-->"

sass:
  sass_dir: assets/css
  style: compressed

nav:
  - name: "Projects"
    link: "/projects/"
  - name: "About"
    link: "/about/"
  - name: "Blog"
    link: "/blog/"
  - name: "Publications"
    link: "/pub/"
  - name: "Contact"
    link: "mailto:15210283759a@gmail.com"

collections:
  zh:
    output: true
    permalink: /zh/:name/
  publications:
    output: true
    permalink: /publications/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: zh
    values:
      layout: post
  - scope:
      path: ""
      type: publications
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - _tex
  - scripts
  - Makefile
  - README.md
  - assets/README.md
