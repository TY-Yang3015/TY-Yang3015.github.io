---
layout: default
---
<article class="post-shell prose">
  <header class="post-header">
    <div class="eyebrow">
      <span>{{ page.series | default: "Research note" }}</span>
      <span class="eyebrow-rule" aria-hidden="true"></span>
      {% if page.date %}<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time>{% endif %}
    </div>
    <h1>{{ page.title }}</h1>
    <div class="post-header-rail" aria-hidden="true"><span></span><span></span><span></span></div>
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>
