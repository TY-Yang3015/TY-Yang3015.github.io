---
layout: default
---
<article class="post-shell prose post-prose">
  <header class="post-header">
    <p class="kicker">{% if page.series %}{{ page.series }}{% else %}Post{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.date %}<time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %b %Y" }}</time>{% endif %}
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>
